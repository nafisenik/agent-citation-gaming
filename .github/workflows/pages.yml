name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The demo replays recorded runs from a static file. If that file is missing or
      # malformed the site still deploys but every scene is empty, so fail here instead.
      - name: Check the recorded runs parse
        run: python3 -c "import json,sys; d=json.load(open('demo/data/story.json')); sys.exit(0 if d.get('targets') else 'story.json has no targets')"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4

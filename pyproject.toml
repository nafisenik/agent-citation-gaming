[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-citation-gaming"
version = "0.1.0"
description = "Measure whether rewriting a paper's metadata from an AI agent's own search queries changes whether it gets cited"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nafiseh Nikeghbal" }]
keywords = ["retrieval", "citations", "llm-agents", "evaluation", "bm25"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/nafisenik/agent-citation-gaming"
Demo = "https://nafisenik.github.io/agent-citation-gaming/"

[project.scripts]
acg = "acg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
